{% include 'medstore_app/header.html' %}
<div class="admin-layout">
  {% include 'medstore_app/admin_sidebar.html' %}

  <main class="admin-main">
    <!-- existing admin page content here -->
    <div class="card">
      <h2>Admin Dashboard</h2>
      <!-- ... -->
    </div>
  </main>
</div>
<div class="container">
  <div class="card">
    <h3>All Messages</h3>
    <ul>
      {% for m in messages %}
        <li><strong>{{ m.name }}</strong> ({{ m.email }}) — {{ m.message }}</li>
      {% empty %}
        <li>No messages found</li>
      {% endfor %}
    </ul>
  </div>
</div>
{% include 'medstore_app/footer.html' %}

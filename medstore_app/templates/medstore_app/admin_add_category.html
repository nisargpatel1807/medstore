{% include 'medstore_app/header.html' %}
<div class="admin-layout">
  {% include 'medstore_app/admin_sidebar.html' %}

  <main class="admin-main">
    <!-- existing admin page content here -->
    <div class="card">
      <h2>Admin Dashboard</h2>
      <!-- ... -->
    </div>
  </main>
</div>
<div class="container form-box">
  <div class="card">
    <h3>Add Category</h3>

    {% if success %}<p class="msg">{{ success }}</p>{% endif %}
    {% if error %}<p class="msg">{{ error }}</p>{% endif %}

    <form method="post">
      {% csrf_token %}
      <label>Category Name</label>
      <input type="text" name="name" required>

      <button class="btn" type="submit">Add</button>
    </form>
  </div>
</div>
{% include 'medstore_app/footer.html' %}
